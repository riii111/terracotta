id: test-cfg-module-boundary
language: Rust
severity: error
message: Test-dependent cfg on this item violates the module-boundary rule.
note: |-
  Put test-only code under a mod tests entry with the needed positive test condition.
  A not(test) branch is production code: keep it outside tests and reconsider switching
  production implementations based on whether tests are being built.
  Keep cross-crate test-support APIs separately feature-gated.
files:
  - src/**/*.rs
  - tests/**/*.rs
  - examples/**/*.rs
utils:
  test-cfg:
    kind: attribute_item
    has:
      kind: attribute
      all:
        - has:
            kind: identifier
            regex: '^cfg$'
        - has:
            kind: token_tree
            has:
              kind: identifier
              regex: '^test$'
              stopBy: end
  attribute-or-comment:
    any:
      - kind: attribute_item
      - kind: line_comment
      - kind: block_comment
rule:
  all:
    - matches: test-cfg
    - not:
        precedes:
          kind: mod_item
          has:
            field: name
            kind: identifier
            regex: '^tests$'
          stopBy:
            not:
              matches: attribute-or-comment
