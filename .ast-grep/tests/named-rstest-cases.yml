id: named-rstest-cases
valid:
  - '#[rstest] #[case::up_arrow(Key::Up)] fn maps(#[case] key: Key) {}'
  - |-
    #[rstest]
    #[case::up_arrow(Key::Up)]
    #[case::up_vim(Key::Char('k'))]
    fn maps(#[case] key: Key) {}
  - '#[rstest] #[case::empty("")] fn accepts(#[case] text: &str) {}'
  - 'fn f(#[case] value: i32) {}'
  - 'const TEXT: &str = "#[case(1)] fn f() {}";'
  - '// #[case(1)] fn f() {}'
  - '#[case(1)] struct S;'
  - '#[case(1)] const VALUE: i32 = 1; fn f() {}'
  - '#[case::named(1)] fn f() {}'
invalid:
  - '#[rstest] #[case(1)] fn f(#[case] value: i32) {}'
  - '#[rstest] #[case] fn f(#[case] value: i32) {}'
  - '#[case(1)] fn f() {}'
  - |-
    #[rstest]
    #[case::named(1)]
    #[case(2)]
    fn f(#[case] value: i32) {}
  - |-
    #[case(1)]
    #[allow(dead_code)]
    fn f() {}
  - |-
    #[case(1)]
    /// A test.
    fn f() {}
  - |-
    #[case(1)]
    /* test */
    fn f() {}
  - |-
    #[case
      (1)]
    fn f() {}
