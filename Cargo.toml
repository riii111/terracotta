[package]
name = "terracotta"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Review Terraform plans in an interactive terminal"
repository = "https://github.com/riii111/terracotta"
publish = false

[features]
test-support = []

[dependencies]
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
hcl = { package = "hcl-rs", version = "0.19.8" }
insta = "1"
rstest = "0.26"

[lints.rust]
redundant_imports = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
absolute_paths = "warn"
dbg_macro = "deny"
exit = "deny"
get_unwrap = "deny"
mem_forget = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
